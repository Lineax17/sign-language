[project]
name = "asl-live"
version = "0.1.0"
description = "Live runtime inference for ASL sign language classifier"
requires-python = ">=3.11,<3.12"
dependencies = [
    "tensorflow>=2.15.0",
    "opencv-python>=4.7.0.68",
    "mediapipe<0.10.8",
    "numpy>=1.21.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.6.0",
]
