[project]
name = "asl-training"
version = "0.1.0"
description = "Training pipeline for ASL sign language classifier"
requires-python = ">=3.11,<3.12"
dependencies = [
    "tensorflow-rocm==2.14.0.600",
    "h5py>=3.10",
    "pandas>=1.5.0",
    "keras-tuner>=1.1.0",
    "matplotlib>=3.5.0",
    "numpy>=1.26,<2",
    "scikit-learn>=1.4.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.6.0",
]

[tool.uv]
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]
